# Фаза 4: раскомментировать/вставить ВМЕСТО закомментированного блока location /mcp
# в /opt/vl-innovativbau/nginx/conf.d/pochva-d.conf (host d.pavellevdin.ru).
# Правка conf.d только через `nginx -t` до reload и с бэкапом каталога.
#
# Вход /mcp пускаем на контейнер pochva-mcp по имени в vl-network (порт наружу закрыт).
# Bearer владельца проверяет САМ pochva-mcp — nginx его не знает и не должен.

location = /mcp {
    proxy_pass http://pochva-mcp:8788/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # MCP Streamable HTTP: буферизация ломает длинные потоки.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    chunked_transfer_encoding on;
}
